<style>

body {
  background-color: white;

  background-attachment: fixed; 
  background-size: 100% 100%;

  font-family: sans-serif;

.navbar {
  overflow: hidden;
  background: linear-gradient(180deg,rgba(186, 199, 218, 1) 0%, rgba(92, 120, 155, 1) 100%);

  top: 0; 
  color: #ffffff;
  width: 100%; 
}

.navbar a {
  float: left;
  display: block;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  color: #ffffff;

}

div.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start;
}

div.gallery-item {
  margin: 5px;
  border: 1px solid #ccc;
  width: 140px;
  background-color: #f7f7f7;
  border-radius: 8px;
}

div.gallery-item:hover {
  border: 1px solid #777;
}

div.gallery-item img {
  width: 100%;
  height: auto;
}

div.gallery-item div.desc {
  padding: 5px;
  text-align: center;
}

.button {
  border: none;
  background-color: DarkOrchid;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
  border-radius: 15px;
}
